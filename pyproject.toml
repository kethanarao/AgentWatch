[project]
name = "agentwatch"
version = "1.0.0"
description = "Local-first AI evaluation and reliability control center"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.7,<3", "langgraph>=1.0,<2", "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1", "numpy>=2,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "pyyaml>=6,<7", "deepeval>=3,<4"]
local = ["sentence-transformers>=3,<6", "faiss-cpu>=1.10,<2"]
observability = ["opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2"]
postgres = ["psycopg[binary]>=3.2,<4"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "evals"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
